<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STPP RFFF Retrieval (mock)</title>
    <style>
      html, body { height: 100%; }
      body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 60rem; line-height: 1.4;
             display: flex; flex-direction: column; padding: 0 1rem; box-sizing: border-box; }
      header, footer { flex: none; }
      h1 { font-size: 1.3rem; margin: 0.8rem 0 0.4rem; }
      /* One scroll region for the whole conversation. */
      #chat { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-right: 0.3rem; }
      footer { border-top: 1px solid #ddd; padding: 0.5rem 0 0.8rem; }
      textarea { width: 100%; box-sizing: border-box; font: inherit; }
      #token-banner { background: #fdd; border: 1px solid #c66; padding: 0.5rem 0.8rem; display: none; }
      .controls { display: flex; gap: 0.5rem; align-items: center; margin: 0.4rem 0; flex-wrap: wrap; }
      #presets button { margin-right: 0.4rem; }
      #mode { font-weight: 600; }
      #mode.warn { color: #b56b00; }
      #mode.failed { color: #b00020; }
      #mode.complete { color: #0a7a2f; }
      /* Transcript message cards — direct children only (markdown and plan
         rows nest their own <li>s and must not inherit card styling). */
      #transcript { list-style: none; padding: 0; margin: 0.6rem 0; }
      #transcript > li { padding: 0.4rem 0.6rem; border-left: 3px solid #ccc; margin-bottom: 0.4rem; background: #fafafa; }
      #transcript > li.user { border-left-color: #2b6cb0; }
      #transcript > li.assistant { border-left-color: #0a7a2f; }
      #transcript > li.agent { border-left-color: #b56b00; background: #fcfaf4; }
      #transcript .role { font-weight: 700; font-size: 0.8em; color: #555; display: block; }
      #transcript .content { white-space: pre-wrap; display: block; font-size: 0.9em; }
      #transcript .content.md { white-space: normal; }
      /* In-chat agent activity: intent + live step checklist. */
      .agent-status { margin: 0.2rem 0; font-style: italic; color: #666; }
      .intent { margin: 0.2rem 0; font-style: italic; color: #444; }
      .plan { list-style: none; padding: 0; margin: 0; font-size: 0.9em; }
      .plan li { padding: 0.2rem 0.4rem; border-bottom: 1px solid #eee; }
      .plan li:last-child { border-bottom: none; }
      .glyph { display: inline-block; width: 1.4rem; text-align: center; }
      .plan li.running .glyph { animation: spin 1s linear infinite; }
      .plan li.complete .glyph { color: #0a7a2f; }
      .plan li.failed .glyph { color: #b00020; }
      .plan li.repairing { background: #fff3d6; }
      .plan li.repairing .glyph { color: #b56b00; animation: pulse 1s ease-in-out infinite; }
      .state-label { color: #b56b00; font-style: italic; margin-left: 0.4rem; }
      .tool { font-weight: 700; }
      .args { font-family: monospace; font-size: 0.85em; color: #555; margin-left: 0.4rem; }
      .meta { color: #555; margin-left: 0.4rem; }
      .summary { font-size: 0.85em; color: #666; margin-left: 1.9rem; }
      .step-error { font-size: 0.85em; color: #b00020; margin-left: 1.9rem; }
      /* Sanitized-markdown rendering (assistant transcript turns) */
      .md h1, .md h2, .md h3, .md h4 { font-size: 1rem; margin: 0.7rem 0 0.3rem; }
      .md p, .md ul, .md ol { margin: 0.35rem 0; }
      .md li { margin: 0.15rem 0; }
      .md table { border-collapse: collapse; margin: 0.5rem 0; }
      .md th, .md td { border: 1px solid #ccc; padding: 0.2rem 0.5rem; text-align: left; }
      .md code { background: #eee; padding: 0 0.25rem; font-size: 0.9em; }
      .md hr { border: none; border-top: 1px solid #ddd; margin: 0.7rem 0; }
      #error-panel { display: none; background: #fdd; border: 1px solid #c66; padding: 0.5rem 0.8rem; margin-top: 0.8rem; }
      details.panel { border-top: 1px solid #eee; margin: 0.3rem 0; }
      details.panel > summary { cursor: pointer; font-weight: 600; padding: 0.35rem 0; }
      #rawlog pre { background: #111; color: #ddd; padding: 0.6rem; overflow-x: auto; font-size: 0.78em; max-height: 20rem; overflow-y: auto; }
      #seq-gap { display: none; background: #b56b00; color: #fff; border-radius: 3px; padding: 0 0.4rem; margin-left: 0.5rem; font-size: 0.8em; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 50% { opacity: 0.3; } }
    </style>
  </head>
  <body>
    <header>
      <h1>STPP RFFF Retrieval — mock frontend</h1>
      <div id="token-banner">
        No demo tokens found — run <code>make tokens</code>, then reload.
      </div>
      <div class="controls">
        <label for="user">User:</label>
        <select id="user"></select>
        <span id="mode">idle</span>
      </div>
    </header>
    <main id="chat">
      <ul id="transcript"></ul>
      <div id="error-panel"><strong id="error-code"></strong> <span id="error-message"></span></div>
      <details class="panel" id="rawlog">
        <summary>Raw event log<span id="seq-gap">seq gap</span></summary>
        <pre id="log"></pre>
      </details>
    </main>
    <footer>
      <div class="controls"><span id="presets"></span></div>
      <textarea id="query" rows="3" placeholder="Natural-language query…"></textarea>
      <div class="controls">
        <button id="submit">Submit</button>
        <button id="new-convo">New conversation</button>
      </div>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
